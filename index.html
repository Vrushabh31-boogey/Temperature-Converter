<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="main">
        <div class="header">
            <h1>Temperature Converter</h1>
        </div>
        <div class="content">
            <label for="celsius">Celsius: </label> 
            <input type="number" id="celsius" name="celsius" placeholder="Enter Temperature"><br><br>
            <label for="fahrenheit">Fahrenheit: </label>
            <input type="number" id="fahrenheit" name="fahrenheit" placeholder="Enter Temperature"><br><br>
            <label for="kelvin">Kelvin: </label>
            <input type="number" id="kelvin" name="kelvin" placeholder="Enter Temperature"><br><br>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
